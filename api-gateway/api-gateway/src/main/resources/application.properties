
spring.application.name=api-gateway

server.port=8087

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webmvc.discovery.locator.enabled=true
spring.cloud.gateway.server.webmvc.discovery.locator.lower-case-service-id=true

# Product Service Route
spring.cloud.gateway.server.webmvc.routes[0].id=product-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://product-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/products/**

# Order Service Route
spring.cloud.gateway.server.webmvc.routes[1].id=order-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/orders/**

# User Service Route
spring.cloud.gateway.server.webmvc.routes[2].id=user-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/users/**

# Cart Service Route
spring.cloud.gateway.server.webmvc.routes[3].id=cart-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://cart-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/cart/**

# Payment Service Route
spring.cloud.gateway.server.webmvc.routes[4].id=payment-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://payment-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/payments/**

# CORS configuration for CartNova UI
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowed-origins=http://127.0.0.1:5500,http://localhost:5500
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowed-headers=*
# Authentication Route
spring.cloud.gateway.server.webmvc.routes[5].id=auth-service
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/auth/**